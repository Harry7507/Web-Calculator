<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="base">
        <input id="screen" readonly></input>
        <div class="keypad">
            <button onclick="appearOnScreen('+')" class="operation">+</button>
            <button onclick="appearOnScreen('7')">7</button>
            <button onclick="appearOnScreen('8')">8</button>
            <button onclick="appearOnScreen('9')">9</button>
            <button onclick="appearOnScreen('-')" class="operation">-</button>
            <button onclick="appearOnScreen('4')">4</button>
            <button onclick="appearOnScreen('5')">5</button>
            <button onclick="appearOnScreen('6')">6</button>
            <button onclick="appearOnScreen('*')" class="operation">X</button>
            <button onclick="appearOnScreen('1')">1</button>
            <button onclick="appearOnScreen('2')">2</button>
            <button onclick="appearOnScreen('3')">3</button>
            <button onclick="appearOnScreen('/')" class="operation">/</button>
            <button onclick="appearOnScreen('%')" class="operation">%</button>
            <button onclick="appearOnScreen('0')">0</button>
            <button onclick="calculate()" id="equal">=</button>
            <button onclick="erase()" class="bottom-buttons">Del</button>
            <button onclick="clearSc()" class="bottom-buttons">C</button>
            <button onclick="appearOnScreen('.')" class="bottom-buttons">.</button>
            <button> </button>
        </div>  
    </div>
</body>
</html>
